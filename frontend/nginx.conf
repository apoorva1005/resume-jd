server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy the API through the same origin as the page. This is why there is
    # no CORS handling in the JS: the browser sees one origin.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # The first match after a cold start loads two models, so allow more
        # than nginx's 60s default before giving up.
        proxy_read_timeout 180s;
        proxy_connect_timeout 10s;

        # Resume uploads are capped at 5MB by the API; match it here so
        # oversized files are rejected before they reach the backend.
        client_max_body_size 6m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets change on every deploy and are tiny, so don't let the
    # browser cache a stale app.js against a redeployed API.
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }
}
